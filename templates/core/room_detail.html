{% extends 'core/base.html' %}

{% block title %}{{ room.title }} — Room Finder{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'room_list' %}">&larr; Back to all rooms</a>

    <div class="detail-bubble">
        <h2>{{ room.title }}</h2>
        <p class="location">📍 {{ room.location }}</p>
        <p class="price">Rs. {{ room.price|floatformat:2 }} / month</p>
        <div class="description">
            {{ room.description }}
        </div>
    </div>
{% endblock %}
