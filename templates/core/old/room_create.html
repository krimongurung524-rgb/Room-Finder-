{% extends 'core/base.html' %}

{% block title %}Add Room — Room Finder{% endblock %}

{% block content %}
<div class="form-bubble">
    <h2>Add a New Room</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="location" placeholder="Location" required>
        <input type="number" step="0.01" name="price" placeholder="Price (Rs.)" required>
        <input type="text" name="slug" placeholder="Slug (e.g. cozy-room-1)" required>
        <textarea name="description" rows="4" placeholder="Description" required></textarea>
        <button type="submit">Save Room</button>
    </form>
</div>
{% endblock %}
