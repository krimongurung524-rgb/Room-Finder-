{% extends 'core/base.html' %}

{% block title %}Add Room — Room Finder{% endblock %}

{% block content %}
<div class="form-bubble">
    <h2>Add a New Room</h2>
    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div style="margin-bottom:16px;">
                {{ field }}
                {% if field.errors %}
                    <p style="color:red; font-size:12px; margin-top:4px;">
                        {{ field.errors.0 }}
                    </p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Save Room</button>
    </form>
</div>
{% endblock %}
