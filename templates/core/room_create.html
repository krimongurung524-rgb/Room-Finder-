<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Room</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #fce7f3);
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
    }
    .container { max-width: 500px; margin: 0 auto; }
    .form-bubble {
        background: #fff;
        border-radius: 28px;
        padding: 36px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .form-bubble h2 { margin: 0 0 24px; color: #1e293b; }
    .form-bubble input,
    .form-bubble textarea {
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 16px;
        border: none;
        background: #f1f5f9;
        border-radius: 16px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: box-shadow 0.2s ease;
    }
    .form-bubble input:focus,
    .form-bubble textarea:focus {
        box-shadow: 0 0 0 3px #c7d2fe;
    }
    .form-bubble button {
        width: 100%;
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 14px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(99,102,241,0.4);
        transition: transform 0.2s ease;
    }
    .form-bubble button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="container">
    <div class="form-bubble">
        <h2>Add a New Room</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Title" required>
            <input type="text" name="location" placeholder="Location" required>
            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <input type="text" name="slug" placeholder="Slug (e.g. cozy-room-1)" required>
            <textarea name="description" rows="4" placeholder="Description" required></textarea>
            <button type="submit">Save Room</button>
        </form>
    </div>
</div>
</body>
</html>
