{% extends 'core/base.html' %}

{% block title %}Edit {{ room.title }} — Room Finder{% endblock %}

{% block content %}
<div class="form-bubble">
    <h2>Edit Room</h2>
    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div style="margin-bottom:16px;">
                <label style="font-size:13px; color:#64748b; font-weight:600;">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p style="color:#ef4444; font-size:12px; margin-top:4px;">
                        {{ field.errors.0 }}
                    </p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-pill" style="width:100%; margin-bottom:12px;">
            💾 Save Changes
        </button>
        <a href="{% url 'room_detail' room.slug %}"
           style="display:block; text-align:center; color:#64748b; font-size:14px;">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
