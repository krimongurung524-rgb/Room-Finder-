{% extends 'core/base.html' %}

{% block title %}Delete {{ room.title }} — Room Finder{% endblock %}

{% block content %}
<div class="form-bubble" style="text-align:center;">
    <h2 style="color:#ef4444; margin-bottom:16px;">🗑️ Delete Room</h2>
    <p style="color:#64748b; margin-bottom:24px;">
        "<strong>{{ room.title }}</strong>" lai permanently delete garne? <br>
        Yo action undo garna sakidaina!
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit"
                style="background:#ef4444; color:#fff; border:none; padding:14px 28px;
                       border-radius:999px; font-size:15px; font-weight:700;
                       cursor:pointer; width:100%; margin-bottom:12px;">
            🗑️ Yes, Delete
        </button>
    </form>

    <a href="{% url 'room_detail' room.slug %}"
       style="display:block; text-align:center; color:#64748b; font-size:14px;">
        Cancel — Back to Room
    </a>
</div>
{% endblock %}
