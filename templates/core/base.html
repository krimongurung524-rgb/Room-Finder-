<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Room Finder{% endblock %}</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #fce7f3);
        min-height: 100vh;
        padding: 0 0 40px 0;
    }
    nav {
        background: #ffffff;
        padding: 16px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        border-radius: 0 0 20px 20px;
        margin-bottom: 40px;
    }
    nav .logo { font-size: 20px; font-weight: 700; color: #6366f1; }
    nav a {
        color: #4338ca;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        margin-left: 20px;
    }
    nav a:hover { color: #6366f1; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
    .btn-pill {
        display: inline-block;
        background: #6366f1;
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(99,102,241,0.4);
        transition: transform 0.2s ease;
    }
    .btn-pill:hover { transform: translateY(-2px); }
    .room-bubble {
        background: #ffffff;
        border-radius: 24px;
        padding: 24px 28px;
        margin-bottom: 20px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .room-bubble:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    .room-bubble h3 { margin: 0 0 8px; font-size: 20px; color: #1e293b; }
    .room-bubble .location { color: #64748b; font-size: 14px; margin-bottom: 10px; }
    .room-bubble .price {
        display: inline-block;
        background: #ecfdf5;
        color: #059669;
        padding: 4px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 14px;
    }
    .view-btn {
        display: inline-block;
        background: #f1f5f9;
        color: #4338ca;
        padding: 8px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }
    .view-btn:hover { background: #e0e7ff; }
    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #4338ca;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
    }
    .detail-bubble {
        background: #fff;
        border-radius: 28px;
        padding: 36px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .detail-bubble h2 { margin: 0 0 10px; font-size: 26px; color: #1e293b; }
    .detail-bubble .location { color: #64748b; font-size: 15px; margin-bottom: 10px; }
    .detail-bubble .price {
        display: inline-block;
        background: #ecfdf5;
        color: #059669;
        padding: 4px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 16px;
    }
    .description {
        background: #f8fafc;
        border-radius: 18px;
        padding: 20px;
        color: #334155;
        line-height: 1.6;
        margin-top: 16px;
    }
    .form-bubble {
        background: #fff;
        border-radius: 28px;
        padding: 36px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 500px;
        margin: 0 auto;
    }
    .form-bubble h2 { margin: 0 0 24px; color: #1e293b; }
    .form-bubble input,
    .form-bubble textarea {
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 16px;
        border: none;
        background: #f1f5f9;
        border-radius: 16px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: box-shadow 0.2s ease;
    }
    .form-bubble input:focus,
    .form-bubble textarea:focus {
        box-shadow: 0 0 0 3px #c7d2fe;
    }
    .form-bubble button {
        width: 100%;
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 14px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(99,102,241,0.4);
        transition: transform 0.2s ease;
    }
    .form-bubble button:hover { transform: translateY(-2px); }
    .empty-bubble {
        background: #fff;
        border-radius: 24px;
        padding: 40px;
        text-align: center;
        color: #94a3b8;
        box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .page-heading {
        font-size: 24px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 24px;
    }
</style>
</head>
<body>

    {% include 'core/navbar.html' %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
